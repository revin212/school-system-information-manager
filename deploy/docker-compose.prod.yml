name: simsekolah

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simsekolah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simsekolah}
      POSTGRES_DB: ${POSTGRES_DB:-simsekolah}
    volumes:
      - simsekolah_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simsekolah} -d ${POSTGRES_DB:-simsekolah}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_PORT: 8000
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    expose:
      - "8000"

  web:
    build:
      context: ../apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_USE_MOCK: "false"
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Used in Caddyfile via env vars
      APP_DOMAIN: ${APP_DOMAIN}

volumes:
  simsekolah_pgdata:
  caddy_data:
  caddy_config:

