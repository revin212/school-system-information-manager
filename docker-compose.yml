name: simsekolah

services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    container_name: simsekolah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simsekolah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simsekolah}
      POSTGRES_DB: ${POSTGRES_DB:-simsekolah}
    ports:
      - "5432:5432"
    volumes:
      - simsekolah_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simsekolah} -d ${POSTGRES_DB:-simsekolah}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    profiles: ["full"]
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      API_PORT: 8000
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "8000:8000"

  web:
    profiles: ["full"]
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_USE_MOCK: "false"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  simsekolah_pgdata:
