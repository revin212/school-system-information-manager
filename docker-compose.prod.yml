# Production / VPS: stack aplikasi saja; PostgreSQL berjalan terpisah di network Docker bersama.
# Pakai bersama docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full --env-file deploy/.env.prod up -d --build
#
# Buat network sekali (nama bisa diganti; sesuaikan SHARED_DOCKER_NETWORK di env):
#   docker network create shared_db
#
# Layanan postgres di compose utama punya profile "local-db" — tidak ikut tanpa profile itu.
# Service api tidak memakai depends_on ke postgres; pastikan Postgres bersama sudah jalan sebelum api.

networks:
  default:
    name: ${SHARED_DOCKER_NETWORK:-shared_db}
    external: true
